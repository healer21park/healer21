<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Kakao Map Test</title></head>
<body>
<div id="map" style="width:100%;height:400px;"></div>
<div id="status" style="padding:16px;font-family:monospace;"></div>
<script>
function log(msg) {
  document.getElementById('status').innerHTML += '<div>' + msg + '</div>';
}
</script>
<script
  src="https://dapi.kakao.com/maps/sdk/v2/kakaomap.cls.js?appkey=1a8c54357e7556d5d50a31946fdfc3a3&autoload=false"
  onerror="document.getElementById('status').innerHTML='<b style=color:red>스크립트 로드 실패 (503/네트워크 오류)</b>'"
  onload="
    log('SDK 로드 성공');
    kakao.maps.load(function() {
      var container = document.getElementById('map');
      var options = { center: new kakao.maps.LatLng(36.5, 127.5), level: 7 };
      var map = new kakao.maps.Map(container, options);
      log('지도 생성 성공!');
    });
  "
></script>
</body>
</html>
